# Render.com Blueprint — deploy the NestJS API.
# Visit https://dashboard.render.com/blueprints, point at this repo, and Render will
# spin up the service with the build & start commands defined here.
# Database connection is to your existing Neon Postgres (DATABASE_URL set in dashboard).
services:
  - type: web
    name: nbt-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # `npm install` runs the postinstall (prisma generate); `npm run build` builds both apps.
    buildCommand: npm install --no-audit --no-fund && npm run build
    # Top-level `start` script in package.json launches the compiled API.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      # Render injects PORT automatically — our main.ts reads it.
      - key: CORS_ORIGIN
        value: https://naijabilltracker.com.ng,https://www.naijabilltracker.com.ng
      - key: PUBLIC_WEB_URL
        value: https://naijabilltracker.com.ng
      # Secrets — set these in the Render dashboard, do NOT commit values.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Naija Bill Tracker <alerts@naijabilltracker.com.ng>
      - key: EMAIL_PROVIDER
        value: resend
      - key: USE_LIVE_SOURCES
        value: "true"
      - key: NASS_MAX_BILLS
        value: "200"
