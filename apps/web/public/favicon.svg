<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Naija Bill Tracker">
  <!-- Rounded square in Nigerian flag green -->
  <rect width="64" height="64" rx="12" ry="12" fill="#008753"/>

  <!-- Suspended scales of justice: pivot + crossbar + two pans.
       Reads as "law" at small sizes; the curved pans also evoke the rim of a chart. -->
  <g fill="none" stroke="#D4A11E" stroke-width="2" stroke-linecap="round">
    <!-- Vertical pivot -->
    <line x1="32" y1="12" x2="32" y2="22"/>
    <!-- Crossbar -->
    <line x1="14" y1="18" x2="50" y2="18"/>
    <!-- Suspension lines -->
    <line x1="18" y1="18" x2="14" y2="24"/>
    <line x1="18" y1="18" x2="22" y2="24"/>
    <line x1="46" y1="18" x2="42" y2="24"/>
    <line x1="46" y1="18" x2="50" y2="24"/>
    <!-- Pans -->
    <path d="M11 24 Q18 30 25 24"/>
    <path d="M39 24 Q46 30 53 24"/>
  </g>

  <!-- Bold Naira sign: economics + Nigeria. Drawn as paths to render crisply at 16px. -->
  <g fill="#FFFFFF">
    <!-- Vertical strokes of the N -->
    <rect x="20" y="32" width="4" height="22" rx="0.5"/>
    <rect x="40" y="32" width="4" height="22" rx="0.5"/>
    <!-- Diagonal stroke of the N -->
    <path d="M24 32 L44 54 L40 54 L20 32 Z"/>
    <!-- Two horizontal crossbars (the ₦ glyph) -->
    <rect x="17" y="38" width="30" height="2.6" rx="1"/>
    <rect x="17" y="45" width="30" height="2.6" rx="1"/>
  </g>
</svg>
